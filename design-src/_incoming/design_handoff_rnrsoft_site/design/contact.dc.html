<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 — rnrsoft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; background:#0b0c0e; color:#eceef1; font-family:'Pretendard',sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-0.011em; }
  a { color:#d8b489; text-decoration:none; }
  a:hover { color:#e7c9a6; }
  ::selection { background:rgba(198,154,107,0.28); }
  @keyframes rnr-drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-18px,14px)} }
  @keyframes rnr-rise { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
</style>
</helmet>

<div style="position:relative; overflow-x:hidden; min-height:100vh; display:flex; flex-direction:column;">

  <header style="position:sticky; top:0; z-index:50; background:rgba(11,12,14,0.78); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,0.08);">
    <div style="max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:20px 32px;">
      <a href="index.dc.html" style="display:flex; align-items:center; gap:12px; font-size:17px; font-weight:600; color:#eceef1; letter-spacing:-0.02em;">
        <svg viewBox="0 0 34 34" width="27" height="27"><rect x="1" y="1" width="32" height="32" rx="10" fill="none" stroke="#c69a6b" stroke-width="1.4"/><g fill="#d8b489"><rect x="9.5" y="13" width="3" height="8" rx="1.5"/><rect x="15.5" y="9" width="3" height="16" rx="1.5"/><rect x="21.5" y="11.5" width="3" height="11" rx="1.5"/></g></svg>
        rnrsoft
      </a>
      <nav style="display:flex; align-items:center; gap:4px;">
        <a href="index.dc.html" style="padding:8px 14px; color:#9498a1; font-size:14.5px;" data-en="Apps">앱</a>
        <a href="about.dc.html" style="padding:8px 14px; color:#9498a1; font-size:14.5px;" data-en="About">소개</a>
        <a href="contact.dc.html" style="padding:8px 14px; color:#e7ceb0; font-size:14.5px; font-weight:600;" data-en="Contact">문의</a>
        <button onClick="{{ toggleLang }}" style="margin-left:10px; padding:7px 13px; border-radius:8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#c8ccd3; font-family:'JetBrains Mono',monospace; font-size:12px; cursor:pointer;">{{ langLabel }}</button>
      </nav>
    </div>
  </header>

  <section style="position:relative; overflow:hidden; flex:1;">
    <div style="position:absolute; top:-16%; left:50%; transform:translateX(-50%); width:660px; height:460px; background:radial-gradient(circle,rgba(198,154,107,0.12),transparent 64%); filter:blur(40px); animation:rnr-drift 18s ease-in-out infinite;"></div>
    <div style="position:relative; max-width:820px; margin:0 auto; padding:120px 32px 80px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.15em; text-transform:uppercase; color:#8a8e97; animation:rnr-rise .6s ease both;">Contact</div>
      <h1 style="margin:18px 0 0; font-size:clamp(32px,5.5vw,54px); line-height:1.08; font-weight:600; letter-spacing:-0.04em; color:#f3f4f6; animation:rnr-rise .7s ease .08s both;"><span data-en="Say hello.">편하게 연락 주세요.</span></h1>
      <p style="margin:24px 0 0; font-size:17px; line-height:1.75; color:#9498a1; max-width:520px; animation:rnr-rise .7s ease .16s both;" data-en="Feedback, a bug report, or a collaboration — email is the fastest way, and every message is read.">피드백, 버그 제보, 협업 제안 모두 메일이 가장 빠릅니다. 모든 메일을 직접 읽습니다.</p>

      <div style="display:flex; gap:18px; flex-wrap:wrap; margin-top:44px; animation:rnr-rise .7s ease .24s both;">
        <a href="mailto:contact@rnrsoft.vip" style="flex:1; min-width:280px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:30px 32px; border-radius:16px; background:rgba(216,180,137,0.06); border:1px solid rgba(216,180,137,0.24); color:inherit; transition:border-color .3s, background .3s;" style-hover="border-color:rgba(216,180,137,0.5); background:rgba(216,180,137,0.1);">
          <div>
            <div style="font-size:12px; color:#a5a9b2; margin-bottom:7px;" data-en="Email">이메일</div>
            <div style="font-size:20px; font-weight:600; color:#f3f4f6; letter-spacing:-0.02em;">contact@rnrsoft.vip</div>
          </div>
          <span style="font-size:20px; color:#d8b489;">↗</span>
        </a>
        <a href="https://note.rnrsoft.vip" style="flex:1; min-width:280px; display:flex; flex-direction:column; justify-content:center; gap:7px; padding:30px 32px; border-radius:16px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.08); color:inherit; transition:border-color .3s;" style-hover="border-color:rgba(255,255,255,0.2);">
          <div style="font-size:12px; color:#a5a9b2;" data-en="Live app">서비스 중인 앱</div>
          <div style="font-size:18px; font-weight:600; color:#f3f4f6;">받아쓰기 노트 <span style="color:#d8b489; font-size:15px;">↗</span></div>
          <div style="font-size:13px; color:#7d818a;">note.rnrsoft.vip</div>
        </a>
      </div>
    </div>
  </section>

  <footer style="margin-top:auto; border-top:1px solid rgba(255,255,255,0.07); background:#08090b;">
    <div style="max-width:1120px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:24px; padding:32px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:11px; font-size:15px; font-weight:600; color:#b3b7bf;">
        <svg viewBox="0 0 34 34" width="22" height="22"><rect x="1" y="1" width="32" height="32" rx="10" fill="none" stroke="#c69a6b" stroke-width="1.4"/><g fill="#d8b489"><rect x="9.5" y="13" width="3" height="8" rx="1.5"/><rect x="15.5" y="9" width="3" height="16" rx="1.5"/><rect x="21.5" y="11.5" width="3" height="11" rx="1.5"/></g></svg>
        rnrsoft
      </div>
      <div style="display:flex; gap:24px; font-size:13.5px; color:#7d818a; flex-wrap:wrap;">
        <a href="index.dc.html" style="color:#7d818a;" data-en="Apps">앱</a>
        <a href="about.dc.html" style="color:#7d818a;" data-en="About">소개</a>
        <a href="privacy.dc.html" style="color:#7d818a;" data-en="Privacy">개인정보처리방침</a>
        <a href="terms.dc.html" style="color:#7d818a;" data-en="Terms">이용약관</a>
      </div>
      <div style="font-size:12.5px; color:#565a63; font-family:'JetBrains Mono',monospace;">© {{ year }} rnrsoft</div>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: 'ko' };
  componentDidMount() { try { if (localStorage.getItem('rnr-lang') === 'en') { this.applyLang('en'); this.setState({ lang: 'en' }); } } catch(e){} }
  applyLang(lang) { document.querySelectorAll('[data-en]').forEach(el => { if (!el.dataset.ko) el.dataset.ko = el.innerHTML; el.innerHTML = lang === 'en' ? el.dataset.en : el.dataset.ko; }); document.documentElement.lang = lang; }
  toggleLang = () => { const next = this.state.lang === 'ko' ? 'en' : 'ko'; this.applyLang(next); try { localStorage.setItem('rnr-lang', next); } catch(e){} this.setState({ lang: next }); };
  renderVals() { return { toggleLang: this.toggleLang, langLabel: this.state.lang === 'ko' ? 'EN' : '한국어', year: new Date().getFullYear() }; }
}
</script>
</body>
</html>

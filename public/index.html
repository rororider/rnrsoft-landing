<script src="/lang.js"></script>
<script>
/* ---- 공지 티커 ---- */
var NOTICES = {
  ko: [
    { d: '2026.07', t: '받아쓰기 노트 — 4개 언어 지원 업데이트' },
    { d: '2026.07', t: '새 앱 준비 중 — 곧 공개합니다' },
    { d: '2026.06', t: 'AI 정리·학습카드 기능 개선' },
    { d: '2026.06', t: 'Google Play 개발자 페이지 등록' },
    { d: '2026.05', t: '개인정보처리방침·이용약관 업데이트' },
  ],
  en: [
    { d: '2026.07', t: 'Dictation Note — now supports 4 languages' },
    { d: '2026.07', t: 'A new app is on the way — coming soon' },
    { d: '2026.06', t: 'Improved AI summary & study cards' },
    { d: '2026.06', t: 'Listed on the Google Play developer page' },
    { d: '2026.05', t: 'Updated Privacy Policy & Terms' },
  ],
};
function buildTicker(lang) {
  var el = document.getElementById('ticker'); if (!el) return;
  var items = NOTICES[lang || window.__rnrLang || 'ko'];
  var one = items.map(function (n) {
    return '<span style="display:inline-flex; align-items:center; gap:12px; padding:0 30px; font-size:13.5px; color:#b3b7bf;">'
      + '<span style="font-family:\'JetBrains Mono\',monospace; font-size:11.5px; color:#7d818a;">' + n.d + '</span>'
      + '<span>' + n.t + '</span>'
      + '<span style="color:#3f434c;">/</span></span>';
  }).join('');
  el.innerHTML = '<div style="display:inline-flex; align-items:center;">' + one + '</div><div style="display:inline-flex; align-items:center;">' + one + '</div>';
}
window.__rnrOnLang = function (lang) {
  buildTicker(lang);
  var btn = document.getElementById('soundBtn');
  if (btn) btn.textContent = SND.on ? (lang === 'ko' ? '♫ 사운드 끄기' : '♫ Sound off') : (lang === 'ko' ? '♪ 사운드' : '♪ Sound');
};
document.addEventListener('DOMContentLoaded', function(){ buildTicker(); });

/* ---- 사운드 토이 (Web Audio) ---- */
var SND = { on: false, ac: null, analyser: null, master: null, arp: null, raf: null, pad: [] };
function rnrToggleSound() {
  SND.on = !SND.on;
  var lang = window.__rnrLang || 'ko';
  var btn = document.getElementById('soundBtn');
  if (SND.on) { startAudio(); btn.style.color = '#d8b489'; btn.textContent = lang === 'ko' ? '♫ 사운드 끄기' : '♫ Sound off'; }
  else { stopAudio(); btn.style.color = '#8a8e97'; btn.textContent = lang === 'ko' ? '♪ 사운드' : '♪ Sound'; }
}
function startAudio() {
  var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  SND.ac = new AC();
  SND.master = SND.ac.createGain(); SND.master.gain.value = 0; SND.master.connect(SND.ac.destination);
  SND.analyser = SND.ac.createAnalyser(); SND.analyser.fftSize = 64; SND.master.connect(SND.analyser);
  var lp = SND.ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 950; lp.Q.value = 0.7; lp.connect(SND.master);
  SND.pad = [];
  [110, 164.81, 220].forEach(function (f) {
    var o = SND.ac.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    var g = SND.ac.createGain(); g.gain.value = 0.12; o.connect(g); g.connect(lp); o.start(); SND.pad.push(o, g);
  });
  SND.master.gain.setTargetAtTime(0.55, SND.ac.currentTime, 0.7);
  var notes = [440, 523.25, 587.33, 659.25, 783.99, 880];
  SND.arp = setInterval(function () {
    if (!SND.ac) return;
    var f = notes[Math.floor(Math.random() * notes.length)];
    var o = SND.ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    var g = SND.ac.createGain(); var t = SND.ac.currentTime;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.95);
    o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1);
  }, 540);
  animateBars();
}
function animateBars() {
  var bars = Array.prototype.slice.call(document.querySelectorAll('[data-eqbar]'));
  var data = new Uint8Array(SND.analyser.frequencyBinCount);
  var loop = function () {
    if (!SND.on || !SND.analyser) return;
    SND.analyser.getByteFrequencyData(data);
    bars.forEach(function (b, i) { var v = data[3 + i * 4] / 255; b.style.transform = 'scaleY(' + (0.35 + v * 1.25) + ')'; });
    SND.raf = requestAnimationFrame(loop);
  };
  loop();
}
function stopAudio() {
  cancelAnimationFrame(SND.raf); clearInterval(SND.arp);
  if (SND.ac) { var ac = SND.ac; try { SND.master.gain.setTargetAtTime(0, ac.currentTime, 0.25); } catch (e) {} setTimeout(function () { try { ac.close(); } catch (e) {} }, 600); SND.ac = null; SND.analyser = null; }
  document.querySelectorAll('[data-eqbar]').forEach(function (b) { b.style.transform = ''; });
}
</script>

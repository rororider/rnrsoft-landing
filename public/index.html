<script>

    { d: '2026.06', t: 'Improved AI summary & study cards' },
    { d: '2026.06', t: 'Listed on the Google Play developer page' },
    { d: '2026.05', t: 'Updated Privacy Policy & Terms' },
  ],
};
function buildTicker(lang) {
  var el = document.getElementById('ticker'); if (!el) return;
  var items = NOTICES[lang || window.__rnrLang || 'ko'];
  var one = items.map(function (n) {
    return '<span style="display:inline-flex; align-items:center; gap:12px; padding:0 28px; font-size:13.5px; color:#aab5c6;">'
      + '<span style="font-family:\'JetBrains Mono\',monospace; font-size:11.5px; color:#5cc4f5;">' + n.d + '</span>'
      + '<span>' + n.t + '</span><span style="color:#33405a;">/</span></span>';
  }).join('');
  el.innerHTML = '<div style="display:inline-flex; align-items:center;">' + one + '</div><div style="display:inline-flex; align-items:center;">' + one + '</div>';
}
window.__rnrOnLang = function (lang) { buildTicker(lang); };
document.addEventListener('DOMContentLoaded', function(){ buildTicker(); startRain(); });

/* ---- 매트릭스 레인 (시안 startRain 이식) ---- */
var RAIN = { raf: null, onResize: null };
function startRain() {
  var cv = document.getElementById('rsRain'); if (!cv) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = cv.getContext('2d');
  var glyphs = 'ｦｱｳｴｵｶｷｸｹｺｻｼｽｾｿﬂ0123456789<>[]{}/\\|=+*#$'.split('');
  var FS = 14;
  var cols = 0, drops = [];
  function size() {
    var r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.floor(r.width));
    cv.height = Math.max(1, Math.floor(r.height));
    cols = Math.ceil(cv.width / FS);
    drops = new Array(cols).fill(0).map(function () { return Math.random() * -60; });
  }
  size();
  RAIN.onResize = function () { size(); };
  window.addEventListener('resize', RAIN.onResize);
  var last = 0;
  function step(t) {
    RAIN.raf = requestAnimationFrame(step);
    if (t - last < 70) return;
    last = t;
    ctx.fillStyle = 'rgba(11,18,32,0.22)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = FS + "px 'JetBrains Mono', monospace";
    for (var i = 0; i < cols; i++) {
      var y = drops[i] * FS;
      if (y > 0 && y < cv.height + FS) {
        var g = glyphs[(Math.random() * glyphs.length) | 0];
        ctx.fillStyle = Math.random() < 0.12 ? 'rgba(180,240,255,0.55)' : 'rgba(92,196,245,0.3)';
        ctx.fillText(g, i * FS, y);
      }
      drops[i] += 1;
      if (y > cv.height && Math.random() > 0.975) drops[i] = Math.random() * -30;
    }
  }
  RAIN.raf = requestAnimationFrame(step);
}
</script>

  /* 남는 공간을 위아래로 몰지 않고 콘텐츠 사이에 균등 분배 (소개와 동일 방식).
     gap을 고정하면 좁은 화면에서 space-evenly 간격과 합쳐져 내용이 넘친다
     -> gap은 0으로 두고 간격은 space-evenly에만 맡긴다. */
  .rs-main { flex:1; min-height:0; display:flex; flex-direction:column;
             justify-content:space-evenly; gap:0;
             padding:0; overflow:hidden; }

  .rs-intro { padding:0 34px !important; }

  .rs-eyebrow { margin-bottom:clamp(10px,1.6vh,18px) !important; }

  .rs-sub { margin:clamp(14px,2.2vh,24px) auto 0 !important; }
  .rs-cardrow { margin-top:0 !important; }
  .rs-meta { margin-top:clamp(12px,2vh,26px) !important; }

  .rs-mailcard { padding:clamp(18px,2.8vh,30px) clamp(20px,2.4vw,32px) !important; }
  .rs-appcard2 { padding:clamp(16px,2.4vh,26px) clamp(18px,2.2vw,30px) !important; }

  @media (max-height:820px){

    .rs-meta { font-size:12px !important; gap:14px !important; margin-top:12px !important; }
  }
  @media (max-width:640px) and (max-height:900px){
    .rs-sub { display:none; }        /* 카드가 설명을 대신함 */
  }

     카드 내부를 단계적으로 조여 1화면을 유지한다. */
  @media (max-width:640px) and (max-height:700px){

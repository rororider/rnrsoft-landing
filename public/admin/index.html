<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>방문자 통계 — RnR soft</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/fav-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/brand.css?v=3cd5654f">
<style>
  .wrap { max-width:1180px; margin:0 auto; padding:26px 34px 80px; }
  .kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:26px; }
  .card { background:#141f33; border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:22px;
          box-shadow:0 10px 30px -22px rgba(0,0,0,.5); }
  .kpi .card { animation:rs-rise .5s ease both; }
  .kpi-label { font-family:'Poppins',sans-serif; font-size:11.5px; font-weight:500; letter-spacing:.14em;
               text-transform:uppercase; color:#5cc4f5; }
  .kpi-val { font-size:30px; font-weight:600; color:#f2f6fc; margin-top:10px; letter-spacing:-.03em;
             font-variant-numeric:tabular-nums; }
  .kpi-sub { font-size:12px; color:#7f8b9d; margin-top:5px; }
  h2 { margin:0 0 14px; font-size:15.5px; font-weight:600; color:#f2f6fc; letter-spacing:-.02em; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-weight:500; color:#7f8b9d; font-size:11.5px; letter-spacing:.06em;
       text-transform:uppercase; padding:0 0 10px; border-bottom:1px solid rgba(255,255,255,.09); }
  td { padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05); color:#c6cfdb; }
  td.n { text-align:right; font-variant-numeric:tabular-nums; color:#eef2f8; font-weight:500; }
  .bar { height:6px; border-radius:3px; background:linear-gradient(96deg,#1f56dc,#38c8f0); min-width:3px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; }
  .chart { display:flex; align-items:flex-end; gap:3px; height:150px; margin-top:6px; }
  .chart div { flex:1; background:linear-gradient(180deg,#38c8f0,#1f56dc); border-radius:3px 3px 0 0;
               min-height:2px; transition:opacity .15s; }
  .chart div:hover { opacity:.75; }
  select, .btn { padding:8px 14px; border-radius:9px; background:rgba(255,255,255,.06);
          border:1px solid rgba(255,255,255,.14); color:#c6cfdb; font-family:inherit; font-size:13px; cursor:pointer; }
  .muted { color:#7f8b9d; font-size:12.5px; }

  /* 세계지도 */
  .mapbox { border-radius:14px; overflow:hidden; background:#0e1729; }
  .mapbox svg { display:block; }
  .wm-dot { cursor:default; }
  .wm-dot circle { transition:opacity .2s; }
  .wm-dot:hover circle { opacity:1 !important; }
  .lg { display:inline-flex; align-items:center; gap:6px; font-size:12px; }
  .lg i { width:9px; height:9px; border-radius:50%;
          background:radial-gradient(circle,#7fc4ff,#1f56dc); display:inline-block; }

  /* 최근 방문 표 — 좁은 화면에서 가로 스크롤 */
  .tblwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tblwrap table { min-width:520px; }
  .tblwrap th, .tblwrap td { padding:9px 10px 9px 0; white-space:nowrap; }
  .tblwrap td.ipcell { font-family:'JetBrains Mono',monospace; font-size:12px; color:#98a4b6; }
  .badge-new { display:inline-block; margin-left:6px; font-size:10px; padding:2px 6px;
               border-radius:5px; background:rgba(79,211,156,.16); color:#6fe0b4; }

  /* ---------- 모바일 (≤640px) ---------- */
  @media (max-width:640px){
    .wrap { padding:16px 14px 72px; }

    /* 헤더: 로고 줄 / 컨트롤 줄로 분리 */
    .hd { flex-direction:column; align-items:stretch !important; gap:14px !important; margin-bottom:18px !important; }
    .hd-logo img { height:30px !important; }
    .hd-logo span.nm { font-size:17px !important; }
    .hd-logo span.sb { font-size:8.5px !important; }
    /* 컨트롤을 가로 한 줄에 균등 배치 — 손가락으로 누를 수 있는 크기 확보 */
    /* 사옥 버튼은 전폭, 아래 3개(기간·비밀번호·로그아웃)는 한 줄에 균등 */
    .hd-ctl { display:grid !important; grid-template-columns:repeat(3, 1fr); gap:7px; }
    .hd-ctl a.btn { grid-column:1 / -1; justify-content:center; }
    .hd-ctl select, .hd-ctl .btn { min-height:42px; font-size:12.5px; padding:9px 8px;
                                   text-align:center; justify-content:center; }
    .hd-ctl select { text-align-last:center; }

    /* KPI: 2열 (4개가 1열로 길게 늘어지는 것 방지) */
    .kpi { grid-template-columns:1fr 1fr !important; gap:10px !important; margin-bottom:16px !important; }
    .kpi .card { padding:14px 13px; }
    .kpi-label { font-size:10px; letter-spacing:.1em; }
    .kpi-val { font-size:21px !important; margin-top:7px; }
    .kpi-sub { font-size:11px; margin-top:3px; }

    .card { padding:16px 14px; border-radius:14px; }
    h2 { font-size:14px; }

    /* 차트: 막대가 너무 가늘어지지 않게 높이 축소 + 간격 최소화 */
    .chart { height:110px; gap:2px; }

    /* 표: 막대 열을 줄이고 숫자 우선 */
    table { font-size:13px; }
    td { padding:9px 0; }
    td.bar-cell { width:26% !important; }

    /* 비밀번호 변경 폼 */
    #pwBox { max-width:none !important; }
    #pwBox input { font-size:16px !important; }  /* iOS 자동 확대 방지 */

    .grid2 { grid-template-columns:1fr !important; gap:12px !important; }
  }

  /* 아주 좁은 화면 (≤380px) */
  @media (max-width:380px){
    .kpi-val { font-size:19px !important; }
    /* 3열은 글자가 잘리므로 2열 + 로그아웃 전폭 */
    .hd-ctl { grid-template-columns:1fr 1fr; }
    .hd-ctl #logout { grid-column:1 / -1; }
    td.bar-cell { display:none; }   /* 막대 숨기고 이름+숫자만 */
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hd" style="display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:26px;">
    <a href="/" class="hd-logo" style="display:flex; align-items:flex-end; gap:11px;">
      <img src="/assets/mark.png" alt="" style="height:36px; width:auto; display:block;">
      <span style="display:flex; flex-direction:column; gap:3px;">
        <span class="nm" style="font-family:'Poppins',sans-serif; font-size:20px; font-weight:600; color:#f2f6fc; line-height:1;">RnR <span style="font-weight:300; color:#38c8f0;">soft</span></span>
        <span class="sb" style="font-family:'Poppins',sans-serif; font-size:9px; font-weight:300; letter-spacing:.11em; color:#7d8ba0; line-height:1;">ADMIN · 방문자 통계</span>
      </span>
    </a>
    <div class="hd-ctl" style="display:flex; align-items:center; gap:9px;">
      <a class="btn" href="/api/admin/hq-sso"
         style="text-decoration:none; display:inline-flex; align-items:center; gap:7px; background:linear-gradient(96deg,#1f56dc,#2b86f5); color:#fff; border:none;">
        <span style="font-size:14px;">🏢</span> 가상 사옥 관제
      </a>
      <select id="range">
        <option value="7">최근 7일</option>
        <option value="30" selected>최근 30일</option>
        <option value="90">최근 90일</option>
      </select>
      <button class="btn" id="pwBtn">비밀번호 변경</button>
      <button class="btn" id="logout">로그아웃</button>
    </div>
  </div>

  <!-- 비밀번호 변경 -->
  <div class="card" id="pwBox" style="display:none; margin-bottom:16px; max-width:420px;">
    <h2>비밀번호 변경</h2>
    <form id="pwForm" autocomplete="off">
      <label style="display:block;font-size:12.5px;color:#98a4b6;margin:12px 0 7px">현재 비밀번호</label>
      <input id="pwCur" type="password" required autocomplete="current-password"
             style="width:100%;padding:11px 13px;border-radius:10px;background:#0b1220;color:#eef2f8;border:1px solid rgba(255,255,255,.14);font-size:14.5px;font-family:inherit">
      <label style="display:block;font-size:12.5px;color:#98a4b6;margin:14px 0 7px">새 비밀번호</label>
      <input id="pwNew" type="password" required autocomplete="new-password" placeholder="12자 이상, 3종류 이상 조합"
             style="width:100%;padding:11px 13px;border-radius:10px;background:#0b1220;color:#eef2f8;border:1px solid rgba(255,255,255,.14);font-size:14.5px;font-family:inherit">
      <button type="submit" id="pwSubmit"
              style="width:100%;margin-top:18px;padding:12px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(96deg,#1f56dc,#2b86f5);color:#fff;font-size:14.5px;font-weight:600;font-family:inherit">변경하기</button>
      <div id="pwMsg" style="margin-top:12px;font-size:13px;display:none;line-height:1.6"></div>
    </form>
  </div>

  <div class="kpi" id="kpi"></div>

  <div class="card" style="margin-bottom:16px;">
    <h2>일별 방문 <span class="muted" id="chartLabel"></span></h2>
    <div class="chart" id="chart"></div>
    <div style="display:flex; justify-content:space-between; margin-top:8px;" class="muted">
      <span id="chartFrom"></span><span id="chartTo"></span>
    </div>
  </div>

  <!-- 세계지도 -->
  <div class="card" style="margin-bottom:16px;">
    <h2>접속 지역 <span class="muted">(최근 14일)</span></h2>
    <div id="map" class="mapbox"></div>
    <div id="mapLegend" class="muted" style="margin-top:10px; display:flex; gap:14px; flex-wrap:wrap;"></div>
  </div>

  <div class="grid2">
    <div class="card"><h2>페이지별</h2><table id="tPages"><tbody></tbody></table></div>
    <div class="card"><h2>유입 경로 <span class="muted">(최근 14일)</span></h2><table id="tRef"><tbody></tbody></table></div>
    <div class="card"><h2>국가 <span class="muted">(최근 14일)</span></h2><table id="tGeo"><tbody></tbody></table></div>
    <div class="card"><h2>도시 <span class="muted">(최근 14일)</span></h2><table id="tCity"><tbody></tbody></table></div>
  </div>

  <!-- 최근 방문 -->
  <div class="card" style="margin-top:16px;">
    <h2>최근 방문 <span class="muted">(IP는 마스킹 저장)</span></h2>
    <div class="tblwrap">
      <table id="tRecent">
        <thead><tr><th>시각(KST)</th><th>위치</th><th>IP</th><th>페이지</th><th>유입</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <p class="muted" style="margin-top:22px;" id="foot"></p>
</div>

<!-- 세계지도 렌더러. 아래 인라인 스크립트가 renderWorldMap을 쓰므로 반드시 먼저 로드한다.
     (defer/async를 붙이면 실행 순서가 뒤집혀 지도가 조용히 비어버린다) -->
<script src="/admin/worldmap.js?v=5ef8e1f8"></script>
<script>
var PAGE_LABEL = { '/':'홈', '/apps':'앱', '/about':'소개', '/contact':'문의',
                   '/privacy':'개인정보처리방침', '/terms':'이용약관', 'other':'기타' };
var n = function(v){ return (v||0).toLocaleString('ko-KR'); };

/* HTML 이스케이프 — 국가명·도시명·리퍼러는 외부 입력이므로 그대로 넣지 않는다 */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 국가 코드 -> 한글명 (worldmap.js가 제공, 없으면 코드 그대로) */
function countryName(code){
  var m = window.COUNTRY_NAMES || {};
  return m[code] || code || '알 수 없음';
}

function rows(el, items, labelFn){
  var tb = el.querySelector('tbody');
  if(!items.length){ tb.innerHTML = '<tr><td class="muted" style="padding:14px 0">아직 데이터가 없습니다.</td></tr>'; return; }
  var max = Math.max.apply(null, items.map(function(i){return i.count||i.pv;}));
  tb.innerHTML = items.map(function(i){
    var v = i.count || i.pv;
    // labelFn 결과는 리퍼러 도메인 등 외부 입력을 포함하므로 반드시 이스케이프
    return '<tr><td>' + esc(labelFn(i)) + '</td>'
      + '<td class="bar-cell" style="width:38%"><div class="bar" style="width:' + Math.max(3, v/max*100) + '%"></div></td>'
      + '<td class="n">' + n(v) + '</td></tr>';
  }).join('');
}

async function load(){
  var days = document.getElementById('range').value;
  var r = await fetch('/api/admin/stats?days=' + days, { credentials:'same-origin' });
  if(r.status === 401){ location.href='/admin/'; return; }
  var d = await r.json();
  if(!d.ok){ document.getElementById('foot').textContent = '오류: ' + (d.error||''); return; }

  var sumPv = d.daily.reduce(function(a,b){return a+b.pv;},0);
  var sumUv = d.daily.reduce(function(a,b){return a+b.uv;},0);
  var todayRow = d.daily[d.daily.length-1] || {pv:0,uv:0};

  document.getElementById('kpi').innerHTML = [
    ['오늘 방문', n(todayRow.pv), n(todayRow.uv) + '명 (순방문)'],
    ['기간 합계', n(sumPv), n(sumUv) + '명 · 최근 ' + days + '일'],
    ['누적 조회', n(d.totals.pv), '전체 기간'],
    ['누적 방문자', n(d.totals.uv), '일일 순방문 합산'],
  ].map(function(k,idx){
    return '<div class="card" style="animation-delay:' + (idx*0.06) + 's">'
      + '<div class="kpi-label">' + k[0] + '</div><div class="kpi-val">' + k[1] + '</div>'
      + '<div class="kpi-sub">' + k[2] + '</div></div>';
  }).join('');

  var max = Math.max.apply(null, d.daily.map(function(x){return x.pv;}).concat([1]));
  document.getElementById('chart').innerHTML = d.daily.map(function(x){
    return '<div style="height:' + Math.max(2, x.pv/max*100) + '%" title="' + x.date + ' · ' + x.pv + '회 / ' + x.uv + '명"></div>';
  }).join('');
  document.getElementById('chartLabel').textContent = '최대 ' + n(max) + '회';
  document.getElementById('chartFrom').textContent = d.daily[0] ? d.daily[0].date : '';
  document.getElementById('chartTo').textContent = d.daily.length ? d.daily[d.daily.length-1].date : '';

  rows(document.getElementById('tPages'), d.pages, function(i){ return PAGE_LABEL[i.path] || i.path; });
  rows(document.getElementById('tRef'), d.referrers, function(i){ return i.name === 'direct' ? '직접 방문' : i.name; });
  rows(document.getElementById('tGeo'), d.countries, function(i){ return countryName(i.name); });
  rows(document.getElementById('tCity'), d.cities || [], function(i){
    // "KR|Seoul" -> "Seoul · 대한민국"
    var p = String(i.name).split('|');
    return p.length > 1 ? p[1] + ' · ' + countryName(p[0]) : i.name;
  });

  /* 세계지도 */
  var mapEl = document.getElementById('map');
  if (typeof window.renderWorldMap === 'function') {
    mapEl.innerHTML = window.renderWorldMap(d.countries || []);
    var top = (d.countries || []).slice(0, 6);
    document.getElementById('mapLegend').innerHTML = top.length
      ? top.map(function(c){
          return '<span class="lg"><i></i>' + esc(countryName(c.name)) + ' ' + n(c.count) + '회</span>';
        }).join('')
      : '<span class="muted">아직 방문 기록이 없습니다.</span>';
  } else {
    mapEl.innerHTML = '<div class="muted" style="padding:20px">지도를 불러오지 못했습니다.</div>';
  }

  /* 최근 방문 */
  var rb = document.querySelector('#tRecent tbody');
  var rec = d.recent || [];
  rb.innerHTML = rec.length ? rec.map(function(v){
    var loc = [v.city, countryName(v.c)].filter(Boolean).join(' · ');
    return '<tr>'
      + '<td>' + esc(v.t) + (v.new ? '<span class="badge-new">신규</span>' : '') + '</td>'
      + '<td>' + esc(loc) + '</td>'
      + '<td class="ipcell">' + esc(v.ip) + '</td>'
      + '<td>' + esc(PAGE_LABEL[v.p] || v.p) + '</td>'
      + '<td class="muted">' + esc(v.ref || '직접') + '</td>'
      + '</tr>';
  }).join('') : '<tr><td colspan="5" class="muted" style="padding:14px 0">아직 방문 기록이 없습니다.</td></tr>';

  document.getElementById('foot').textContent = d.user + ' · ' + d.generatedAt + ' 기준 · 봇 트래픽 제외';
}

document.getElementById('range').addEventListener('change', load);

/* 비밀번호 변경 */
document.getElementById('pwBtn').addEventListener('click', function(){
  var box = document.getElementById('pwBox');
  var open = box.style.display !== 'none';
  box.style.display = open ? 'none' : 'block';
  if(!open) document.getElementById('pwCur').focus();
});
document.getElementById('pwForm').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var btn=document.getElementById('pwSubmit'), msg=document.getElementById('pwMsg');
  btn.disabled=true; msg.style.display='none';
  try{
    var r=await fetch('/api/admin/password',{ method:'POST',
      headers:{'Content-Type':'application/json'}, credentials:'same-origin', cache:'no-store',
      body:JSON.stringify({ current:document.getElementById('pwCur').value,
                            next:document.getElementById('pwNew').value })});
    var txt=await r.text(), j=null; try{ j=JSON.parse(txt); }catch(_){}
    if(j && j.ok){
      msg.style.color='#78ffd6';
      msg.textContent='✓ ' + (j.message || '비밀번호를 변경했습니다.');
      document.getElementById('pwForm').reset();
    } else {
      msg.style.color='#ff9b9b';
      msg.textContent=(j && j.error) ? j.error : ('서버 응답 오류 (HTTP '+r.status+')');
    }
  }catch(err){
    msg.style.color='#ff9b9b';
    msg.textContent='요청 실패: '+(err && err.message ? err.message : String(err));
  }
  msg.style.display='block';
  btn.disabled=false;
});
document.getElementById('logout').addEventListener('click', async function(){
  await fetch('/api/admin/logout', { method:'POST', credentials:'same-origin' });
  location.href = '/';
});
load();
</script>
</body>
</html>

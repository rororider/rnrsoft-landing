<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>연결 진단 — RnR soft</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/fav-32.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/brand.css?v=3cd5654f">
<style>
  .wrap{max-width:720px;margin:0 auto;padding:40px 24px}
  .card{background:#141f33;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px}
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
  .row:last-child{border-bottom:none}
  .tag{flex:0 0 auto;width:26px;text-align:center;font-size:15px}
  .name{flex:1;color:#c6cfdb}
  .val{font-family:'JetBrains Mono',monospace;font-size:12px;color:#7f8b9d;text-align:right;max-width:48%;word-break:break-all}
  .ok{color:#78ffd6}.bad{color:#ff9b9b}
</style>
</head>
<body>
<div class="wrap">
  <a href="/admin/" style="display:flex;align-items:flex-end;gap:10px;margin-bottom:22px">
    <img src="/assets/mark.png" alt="" style="height:32px;width:auto;display:block">
    <span style="font-family:'Poppins',sans-serif;font-size:18px;font-weight:600;color:#f2f6fc;line-height:1">RnR <span style="font-weight:300;color:#38c8f0">soft</span></span>
  </a>
  <h1 style="margin:0 0 6px;font-size:20px;font-weight:600;color:#f2f6fc">연결 진단</h1>
  <p style="margin:0 0 20px;font-size:13.5px;color:#98a4b6;line-height:1.6">
    "네트워크 오류"가 났을 때 어디가 막히는지 확인합니다. 아래 결과를 그대로 알려주세요.</p>
  <div class="card" id="out"><div class="row"><span class="name">검사 중…</span></div></div>
  <p style="margin-top:16px;font-size:12.5px;color:#7f8b9d;line-height:1.7">
    ❌가 있으면 대개 <b>광고 차단 확장(uBlock, AdGuard)</b>·<b>백신 웹보호</b>·<b>회사/공용 네트워크 방화벽</b>이
    <code style="font-family:'JetBrains Mono',monospace">/api/</code> 요청을 막는 경우입니다.
    시크릿 창에서 다시 열어보면 확장 문제인지 바로 구분됩니다.</p>
</div>
<script>
var out = document.getElementById('out');
var rows = [];
function add(ok, name, val){
  rows.push('<div class="row"><span class="tag ' + (ok?'ok':'bad') + '">' + (ok?'✓':'❌') + '</span>'
    + '<span class="name">' + name + '</span><span class="val">' + val + '</span></div>');
  out.innerHTML = rows.join('');
}
(async function(){
  add(true, '페이지 로드', location.host);
  add(location.protocol === 'https:', '보안 연결(HTTPS)', location.protocol);
  add(typeof fetch === 'function', 'fetch 지원', typeof fetch);
  add(navigator.onLine, '온라인 상태', navigator.onLine ? 'online' : 'offline');
  add(navigator.cookieEnabled, '쿠키 허용', navigator.cookieEnabled ? 'enabled' : 'blocked');

  // 정적 파일
  try {
    var s = await fetch('/brand.css?cb=' + Date.now(), { cache:'no-store' });
    add(s.ok, '정적 파일 (/brand.css)', 'HTTP ' + s.status);
  } catch (e) { add(false, '정적 파일 (/brand.css)', String(e.message || e)); }

  // 집계 API
  try {
    var h = await fetch('/api/hit', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ p:'/admin/check', r:'' }), cache:'no-store' });
    add(h.ok, '집계 API (/api/hit)', 'HTTP ' + h.status);
  } catch (e) { add(false, '집계 API (/api/hit)', String(e.message || e)); }

  // 관리자 API 경로 도달 확인 — 시도 횟수를 소모하지 않는 전용 헬스체크
  try {
    var a = await fetch('/api/admin/ping', { cache:'no-store' });
    var j = null; try { j = JSON.parse(await a.text()); } catch(_) {}
    add(a.ok, '관리자 API (/api/admin/*)', 'HTTP ' + a.status);
    if (j) {
      add(!!j.kv, '데이터 저장소(KV)', j.kv ? '연결됨' : '미연결');
      add(true, '관리자 계정', j.adminReady ? '생성됨 → 로그인 화면' : '아직 없음 → 계정 만들기 화면');
    }
  } catch (e) { add(false, '관리자 API (/api/admin/*)', String(e.message || e)); }

  add(true, '브라우저', (navigator.userAgent.match(/(Edg|Chrome|Firefox|Safari)\/[\d.]+/g) || ['unknown']).join(' '));
})();
</script>
</body>
</html>
